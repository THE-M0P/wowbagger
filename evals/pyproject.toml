[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wowbagger-evals"
version = "0.1.0"
description = "Evaluation adapters for Wowbagger security benchmark runs"
requires-python = ">=3.12"
dependencies = [
    "rich>=15.0.0",
    "textual>=0.80.0",
    "strix-agent",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
wowbagger-eval = "wowbagger_evals.cli:main"
engage = "wowbagger_evals.engage:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
